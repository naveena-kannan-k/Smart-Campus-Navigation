<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Campus Navigation</title>

    <!-- Leaflet -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Campus CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/campus_map.css') }}">
</head>

<body>

<!-- =========================================================
     HEADER
========================================================= -->

<header class="top-header">

    <div class="brand">

        <div class="brand-icon">🏫</div>

        <div>
            <h1>Smart Campus Navigation</h1>
            <p>Sarah Tucker College</p>
        </div>

    </div>

    <a href="/dashboard" class="dashboard-btn">
        ← Dashboard
    </a>

</header>


<!-- =========================================================
     SEARCH BAR
========================================================= -->

<div class="search-panel">

    <div class="search-box">

        <span class="search-icon">🔍</span>

        <input
            type="text"
            id="destinationInput"
            placeholder="Search campus location..."
            autocomplete="off"
        >

        <button onclick="findDestination()">
            Search
        </button>

    </div>


    <!-- QUICK DESTINATIONS -->

    <div class="quick-buttons">

        <button onclick="selectDestination('Library')">
            📚 Library
        </button>

        <button onclick="selectDestination('Canteen')">
            🍴 Canteen
        </button>

        <button onclick="selectDestination('Computer Science')">
            💻 Computer Science
        </button>

        <button onclick="selectDestination('Main Gate')">
            🚪 Main Gate
        </button>

    </div>

</div>


<!-- =========================================================
     MAP AREA
========================================================= -->

<main class="map-wrapper">

    <div id="campusMap"></div>


    <!-- MAP CONTROLS -->

    <div class="map-controls">

        <button onclick="showMyLocation()"
                class="map-control-btn location-btn">
            📍 My Location
        </button>

        <button onclick="navigateToSelected()"
                class="map-control-btn navigate-main-btn">
            🧭 Navigate
        </button>

        <button onclick="resetCampusView()"
                class="map-control-btn reset-btn">
            🔄 Reset
        </button>

    </div>


    <!-- INFORMATION CARD -->

    <div id="locationInfo"
         class="location-info">

        <div class="info-title">
            📍 Campus Navigation
        </div>

        <div class="info-text">
            Search a building or select a campus location.
        </div>

    </div>

</main>


<!-- =========================================================
     FOOTER
========================================================= -->

<footer class="map-footer">

    <span>🗺️ Interactive Campus Map</span>

    <span>Leaflet | OpenStreetMap</span>

</footer>


<!-- =========================================================
     LEAFLET JS
========================================================= -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<!-- =========================================================
     CAMPUS MAP JS
========================================================= -->

<script src="{{ url_for('static', filename='js/campus_map.js') }}"></script>

</body>
</html>
