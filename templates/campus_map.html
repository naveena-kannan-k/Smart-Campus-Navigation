<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sarah Tucker College - Smart Navigation</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <!-- Campus CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/campus_map.css') }}"
    >
</head>

<body>

    <!-- MAP -->
    <div id="map"></div>


    <!-- NAVIGATION PANEL -->
    <div class="navigation-panel">

        <div class="title">
            🏫 Sarah Tucker College
        </div>

        <div class="subtitle">
            Smart Campus Navigation
        </div>


        <label for="start">
            From
        </label>

        <select id="start">
            <option value="Main Gate">
                Main Gate
            </option>
        </select>

        <label for="destination">
            To
        </label>

        <input
            type="text"
            id="destination"
            placeholder="Search Computer Science, Library..."
            autocomplete="off"
        >


        <div id="results"></div>


        <button
            type="button"
            id="navigateBtn"
        >
            🚶 Start Navigation
        </button>


        <div id="routeInfo"></div>

    </div>


    <!-- LOCATION BUTTON -->
    <button
        type="button"
        class="location-button"
        onclick="goToCollege()"
    >
        📍
    </button>


    <!-- Leaflet JS -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <!-- Campus JS -->
    <script
        src="{{ url_for('static', filename='js/campus_map.js') }}">
    </script>

</body>
</html>
