<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sarah Tucker College - Smart Navigation</title>

    <!-- Leaflet -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Campus CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/campus_map.css') }}">

</head>

<body>

    <!-- MAP -->
    <div id="map"></div>


    <!-- NAVIGATION PANEL -->
    <div class="navigation-panel">

        <div class="title">
            🏫 Sarah Tucker College
        </div>

        <div class="subtitle">
            Smart Campus Navigation
        </div>


        <!-- FROM -->

        <label>From</label>

        <select id="start">

            <option value="Main Gate">
                Main Gate
            </option>

        </select>


        <!-- TO -->

        <label>To</label>

        <input
            type="text"
            id="destination"
            placeholder="Search Computer Science, Library..."
            autocomplete="off">


        <!-- SEARCH RESULTS -->

        <div id="results"></div>


        <!-- NAVIGATION BUTTON -->

        <button id="navigateBtn">

            <span>🚶</span>
            Start Navigation

        </button>


        <!-- ROUTE INFORMATION -->

        <div id="routeInfo"></div>

    </div>


    <!-- LOCATION BUTTON -->

    <button
        class="location-button"
        onclick="goToCollege()">

        📍

    </button>


    <!-- LEAFLET -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


    <!-- ARROW PLUGIN -->

    <script
        src="https://cdn.jsdelivr.net/npm/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js">
    </script>


    <!-- CAMPUS JS -->

    <script
        src="{{ url_for('static', filename='js/campus_map.js') }}">
    </script>

</body>

</html>
