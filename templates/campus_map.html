<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Navigation System</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header class="top-header">
    <div>
        <h1>Campus Navigation</h1>
        <p>Find any place inside the campus</p>
    </div>
</header>


<section class="search-section">

    <div class="search-box">

        <label for="placeInput">
            Enter the place
        </label>

        <div class="search-row">

            <input
                type="text"
                id="placeInput"
                placeholder="Example: MCA, Library, Hostel..."
                autocomplete="off"
            >

            <button onclick="findPlace()">
                Find Location
            </button>

        </div>

        <div id="suggestions" class="suggestions"></div>

    </div>

</section>


<!-- MAP -->

<section class="map-section">

    <div id="map"></div>

</section>


<!-- RESULT -->

<section class="result-container">

    <div id="result" class="result-card">

        <h2>Campus Navigation</h2>

        <p>
            Enter a campus location above and click
            <b>Find Location</b>.
        </p>

    </div>


    <div class="routes">

        <div class="route-card left-route">

            <h3>← Nearby Left Route</h3>

            <div id="leftPlaces">
                <p>Select a destination to see nearby places.</p>
            </div>

        </div>


        <div class="route-card right-route">

            <h3>Nearby Right Route →</h3>

            <div id="rightPlaces">
                <p>Select a destination to see nearby places.</p>
            </div>

        </div>

    </div>

</section>


<footer>
    Campus Navigation System
</footer>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
