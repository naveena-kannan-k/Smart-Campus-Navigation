<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Campus Navigation</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <!-- Leaflet Routing -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"
    >

    <!-- Your CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/campus_map.css') }}"
    >

</head>


<body>


<header class="topbar">

    <div class="brand">

        <div class="brand-icon">🏫</div>

        <div>
            <h1>Smart Campus Navigation</h1>
            <p>Sarah Tucker College</p>
        </div>

    </div>


    <a href="/dashboard" class="dashboard-btn">
        ← Dashboard
    </a>

</header>



<div class="search-panel">

    <div class="search-box">

        <span>🔍</span>

        <input
            id="destinationInput"
            type="text"
            placeholder="Search campus location..."
        >

        <button onclick="findDestination()">
            Search
        </button>

    </div>


    <div class="quick-buttons">

        <button onclick="selectDestination('Library')">
            📚 Library
        </button>

        <button onclick="selectDestination('Canteen')">
            🍴 Canteen
        </button>

        <button onclick="selectDestination('Computer Science')">
            💻 Computer Science
        </button>

        <button onclick="selectDestination('Main Gate')">
            🚪 Main Gate
        </button>

    </div>

</div>



<div class="map-controls">

    <button onclick="showMyLocation()">
        📍 My Location
    </button>

    <button onclick="navigateToSelected()">
        🧭 Navigate
    </button>

    <button onclick="resetCampusView()">
        🔄 Reset
    </button>

</div>



<div id="campusMap"></div>



<div id="locationInfo" class="location-info">

    <div class="info-title">
        📍 Campus Navigation
    </div>

    <div class="info-text">
        Search a building or select a campus location.
    </div>

</div>



<div class="map-footer">

    <span>🗺️ Interactive Campus Map</span>

    <span>OpenStreetMap</span>

</div>



<!-- Leaflet JS -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<!-- Leaflet Routing Machine -->

<script
    src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js">
</script>


<!-- Your JS -->

<script
    src="{{ url_for('static', filename='js/campus_map.js') }}">
</script>


</body>
</html>
