<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Campus Navigation</title>


    <!-- LEAFLET CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <!-- CAMPUS CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/campus_map.css') }}"
    >

</head>


<body>


<!-- =========================================================
     MAP
========================================================= -->

<div id="campusMap"></div>


<!-- =========================================================
     TOP HEADER
========================================================= -->

<div class="top-header">

    <div class="brand">

        <div class="brand-icon">
            🏫
        </div>

        <div>

            <h1>
                Smart Campus Navigation
            </h1>

            <p>
                Sarah Tucker College
            </p>

        </div>

    </div>


    <a href="/dashboard"
       class="dashboard-btn">

        ← Dashboard

    </a>

</div>



<!-- =========================================================
     SEARCH PANEL
========================================================= -->

<div class="search-panel">

    <div class="search-row">

        <span class="search-icon">
            🔎
        </span>

        <input
            type="text"
            id="destinationInput"
            placeholder="Search campus location..."
            autocomplete="off"
        >

        <button
            onclick="findDestination()"
            class="search-btn">

            Search

        </button>

    </div>


    <!-- QUICK LOCATIONS -->

    <div class="quick-buttons">

        <button onclick="quickSelect('Library')">
            📚 Library
        </button>

        <button onclick="quickSelect('Canteen')">
            🍴 Canteen
        </button>

        <button onclick="quickSelect('Computer Science')">
            💻 Computer Science
        </button>

        <button onclick="quickSelect('Main Gate')">
            🚪 Main Gate
        </button>

    </div>

</div>



<!-- =========================================================
     MAP CONTROL PANEL
========================================================= -->

<div class="map-controls">

    <button
        onclick="showMyLocation()"
        class="control-btn location-btn">

        📍 My Location

    </button>


    <button
        onclick="navigateToSelected()"
        class="control-btn navigate-control">

        🧭 Navigate

    </button>


    <button
        onclick="resetCampusView()"
        class="control-btn reset-btn">

        🔄 Reset

    </button>

</div>



<!-- =========================================================
     INFORMATION PANEL
========================================================= -->

<div
    id="locationInfo"
    class="location-info">

    <div class="info-title">
        📍 Campus Navigation
    </div>

    <div class="info-text">

        Search a building or select
        a campus location.

    </div>

</div>



<!-- =========================================================
     MAP LEGEND
========================================================= -->

<div class="map-legend">

    <div class="legend-title">
        Map
    </div>

    <div class="legend-item">
        <span class="legend-dot destination-dot"></span>
        Destination
    </div>

    <div class="legend-item">
        <span class="legend-dot user-dot"></span>
        Your Location
    </div>

    <div class="legend-item">
        <span class="legend-line"></span>
        Walking Route
    </div>

</div>



<!-- =========================================================
     LEAFLET JS
========================================================= -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<!-- =========================================================
     CAMPUS MAP JS
========================================================= -->

<script
    src="{{ url_for('static', filename='js/campus_map.js') }}">
</script>


</body>

</html>
