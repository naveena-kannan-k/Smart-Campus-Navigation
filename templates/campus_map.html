<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sarah Tucker College - Smart Campus Navigation</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/campus_map.css') }}">

</head>

<body>

<header class="top-header">

    <div class="college-title">

        <div class="logo">
            STC
        </div>

        <div>
            <h2>Sarah Tucker College</h2>
            <p>Smart Campus Navigation</p>
        </div>

    </div>


    <div class="search-container">

        <div class="search-box">

            <span class="search-icon">⌕</span>

            <input
                id="searchInput"
                type="text"
                placeholder="Search campus building..."
                autocomplete="off"
            >

            <button id="searchButton">
                Search
            </button>

        </div>

        <div id="searchSuggestions"
             class="suggestions">
        </div>

    </div>

</header>


<main id="map"></main>


<button id="mainGateButton"
        class="floating-button">

    📍 Main Gate

</button>


<section id="routePanel"
         class="route-panel">

    <button id="closeRoute"
            class="close-route">
        ×
    </button>

    <div class="route-title">

        <div class="destination-pin">
            📍
        </div>

        <div>
            <h3 id="destinationName">
                Destination
            </h3>

            <p id="destinationDescription">
                Walking route from Main Gate
            </p>
        </div>

    </div>


    <div class="route-summary">

        <div>
            <strong id="routeDistance">
                --
            </strong>

            <span>Distance</span>
        </div>

        <div>
            <strong id="routeTime">
                --
            </strong>

            <span>Walking</span>
        </div>

    </div>


    <div class="directions">

        <h4>Walking directions</h4>

        <div id="directionList"></div>

    </div>

</section>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="{{ url_for('static', filename='js/campus_map.js') }}"></script>

</body>
</html>
