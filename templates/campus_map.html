```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Smart Campus Navigation
    </title>


    <!-- =====================================================
         LEAFLET CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <!-- =====================================================
         LEAFLET ROUTING MACHINE CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css"
    >


    <!-- =====================================================
         GOOGLE FONT
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         CAMPUS MAP CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/campus_map.css') }}"
    >

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="map-header">

    <div class="header-left">

        <div class="college-icon">
            🏫
        </div>

        <div>

            <h1>
                Smart Campus Navigation
            </h1>

            <p>
                Sarah Tucker College
            </p>

        </div>

    </div>


    <a
        href="/dashboard"
        class="back-button"
    >
        ← Dashboard
    </a>

</header>



<!-- =========================================================
     SEARCH PANEL
========================================================= -->

<section class="search-panel">

    <div class="search-box">

        <span class="search-icon">
            🔍
        </span>

        <input
            type="text"
            id="destinationInput"
            placeholder="Search campus location..."
            autocomplete="off"
        >

        <button
            onclick="findDestination()"
            class="search-button"
        >
            Search
        </button>

    </div>


    <div class="quick-buttons">

        <button
            onclick="selectDestination('Library')"
        >
            📚 Library
        </button>

        <button
            onclick="selectDestination('Canteen')"
        >
            🍴 Canteen
        </button>

        <button
            onclick="selectDestination('Computer Science')"
        >
            💻 Computer Science
        </button>

        <button
            onclick="selectDestination('Main Gate')"
        >
            🚪 Main Gate
        </button>

    </div>

</section>



<!-- =========================================================
     MAIN CONTENT
========================================================= -->

<main class="map-container">


    <!-- =====================================================
         MAP
    ====================================================== -->

    <div
        id="campusMap"
        class="campus-map"
    ></div>


    <!-- =====================================================
         MAP CONTROLS
    ====================================================== -->

    <div class="map-actions">

        <button
            onclick="showMyLocation()"
            class="action-button location-button"
        >
            📍
            <span>My Location</span>
        </button>


        <button
            onclick="navigateToSelected()"
            class="action-button navigate-button"
        >
            🧭
            <span>Navigate</span>
        </button>


        <button
            onclick="resetCampusView()"
            class="action-button reset-button"
        >
            🔄
            <span>Reset</span>
        </button>

    </div>


    <!-- =====================================================
         LOCATION INFORMATION
    ====================================================== -->

    <aside
        id="locationInfo"
        class="location-info"
    >

        <div class="info-title">
            📍 Campus Navigation
        </div>

        <div class="info-text">
            Search a building or select
            a campus location.
        </div>

    </aside>

</main>



<!-- =========================================================
     FOOTER
========================================================= -->

<footer class="map-footer">

    <span>
        🗺️ Interactive Campus Map
    </span>

    <span>
        OpenStreetMap
    </span>

</footer>



<!-- =========================================================
     LEAFLET JS
========================================================= -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>



<!-- =========================================================
     LEAFLET ROUTING MACHINE JS
========================================================= -->

<script
    src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js">
</script>



<!-- =========================================================
     CAMPUS MAP JS
========================================================= -->

<script
    src="{{ url_for('static', filename='js/campus_map.js') }}">
</script>


</body>

</html>
```
