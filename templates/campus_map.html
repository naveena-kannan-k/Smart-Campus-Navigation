<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Campus Navigation</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <link rel="stylesheet" href="campus_map.css">
</head>

<body>

    <!-- TOP HEADER -->
    <header class="top-header">

        <div class="logo-area">
            <div class="logo">SC</div>

            <div>
                <h1>Smart Campus</h1>
                <p>Campus Navigation System</p>
            </div>
        </div>

        <button id="locationBtn" class="location-btn">
            📍 My Location
        </button>

    </header>


    <!-- SEARCH / NAVIGATION PANEL -->
    <section class="control-panel">

        <div class="search-box">

            <label>From</label>

            <select id="fromLocation">
                <option value="current">My Current Location</option>
                <option value="main-gate">Main Gate</option>
                <option value="main-block">Main Block</option>
                <option value="library">Library</option>
                <option value="partition-hall">Partition Hall</option>
                <option value="zoology">Zoology</option>
                <option value="canteen">Canteen</option>
                <option value="john-innes">John Innes Block</option>
                <option value="old-auditorium">Old Auditorium</option>
                <option value="parking">Parking Area</option>
                <option value="canara-bank">Canara Bank</option>
                <option value="tamil">Tamil</option>
                <option value="english">English</option>
                <option value="economics">Economics</option>
                <option value="history">History</option>
                <option value="maths">Maths</option>
                <option value="botany">Botany</option>
                <option value="chemistry">Chemistry</option>
                <option value="physics">Physics</option>
            </select>

        </div>


        <div class="arrow">→</div>


        <div class="search-box">

            <label>To</label>

            <select id="toLocation">

                <option value="">Select Destination</option>

                <option value="main-gate">Main Gate</option>
                <option value="main-block">Main Block</option>
                <option value="library">Library</option>
                <option value="partition-hall">Partition Hall</option>
                <option value="zoology">Zoology</option>
                <option value="canteen">Canteen</option>
                <option value="john-innes">John Innes Block</option>
                <option value="old-auditorium">Old Auditorium</option>
                <option value="parking">Parking Area</option>
                <option value="canara-bank">Canara Bank</option>
                <option value="tamil">Tamil</option>
                <option value="english">English</option>
                <option value="economics">Economics</option>
                <option value="history">History</option>
                <option value="maths">Maths</option>
                <option value="botany">Botany</option>
                <option value="chemistry">Chemistry</option>
                <option value="physics">Physics</option>

            </select>

        </div>


        <button id="routeBtn" class="route-btn">
            🚶 Find Route
        </button>

    </section>


    <!-- MAP -->
    <main id="map"></main>


    <!-- INFORMATION CARD -->
    <div id="infoCard" class="info-card">

        <button id="closeInfo">×</button>

        <h2 id="infoTitle">Campus Location</h2>

        <p id="infoDescription">
            Select a building on the map.
        </p>

    </div>


    <!-- ROUTE INFORMATION -->
    <div id="routeInfo" class="route-info">

        <strong>Route</strong>

        <p id="routeText">
            Select a destination to start navigation.
        </p>

    </div>


    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <script src="campus_map.js"></script>

</body>
</html>
