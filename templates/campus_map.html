<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sarah Tucker College - Campus Navigation</title>

    <!-- Leaflet CSS - separate file download தேவையில்லை -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/campus_map.css') }}"
    >
</head>

<body>

<!-- TOP SEARCH BAR -->
<div class="top-bar">

    <div class="brand">
        <div class="college-logo">STC</div>

        <div>
            <h2>Sarah Tucker College</h2>
            <span>Smart Campus Navigation</span>
        </div>
    </div>

    <div class="search-area">

        <div class="search-box">
            <span>🔍</span>

            <input
                type="text"
                id="destinationSearch"
                placeholder="Search campus destination..."
                autocomplete="off"
            >

            <button id="searchBtn">Search</button>
        </div>

        <div id="suggestions" class="suggestions"></div>

    </div>

</div>


<!-- MAP -->
<div id="map"></div>


<!-- ROUTE INFORMATION -->
<div id="routePanel" class="route-panel">

    <button id="closeRoute" class="close-btn">×</button>

    <div class="route-header">
        <div class="destination-icon">📍</div>

        <div>
            <h3 id="routeTitle">Select a destination</h3>
            <p id="routeSubtitle">
                Search for a building to start navigation
            </p>
        </div>
    </div>

    <div class="route-info">

        <div>
            <strong id="distance">--</strong>
            <span>Distance</span>
        </div>

        <div>
            <strong id="walkingTime">--</strong>
            <span>Walking</span>
        </div>

    </div>

    <div class="route-path">
        <h4>Walking Directions</h4>
        <ol id="directionsList"></ol>
    </div>

</div>


<!-- CURRENT LOCATION -->
<button id="resetBtn" class="map-button">
    📍 Main Gate
</button>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script
    src="{{ url_for('static', filename='js/campus_map.js') }}">
</script>

</body>
</html>
