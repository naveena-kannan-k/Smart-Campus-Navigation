<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Campus Navigation</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/campus_map.css') }}"
    >
</head>

<body>

    <header class="map-header">
        <div>
            <h1>🧭 Smart Campus Navigation</h1>
            <p>Sarah Tucker College • Interactive Campus Map</p>
        </div>
    </header>

    <section class="search-area">

        <input
            type="text"
            id="destinationInput"
            placeholder="Search Computer Science, Library, Canteen..."
        >

        <button onclick="findDestination()">
            🔍 Search
        </button>

    </section>

    <div class="map-tools">

        <button onclick="resetCampusView()">
            🗺️ Full Campus
        </button>

        <button onclick="showMyLocation()">
            📍 My Location
        </button>

    </div>

    <div id="locationInfo" class="location-info">

        <div class="info-title">
            📍 Campus Navigation
        </div>

        <div class="info-text">
            Search a building to start navigation.
        </div>

    </div>

    <!-- MAP -->
    <div id="campusMap"></div>

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <script
        src="{{ url_for('static', filename='js/campus_map.js') }}">
    </script>

</body>

</html>
