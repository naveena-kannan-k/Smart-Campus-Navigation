<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sarah Tucker College - Campus Navigation</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/campus_map.css') }}">
</head>

<body>

<div id="map"></div>

<div class="navigation-panel">

    <h2>🏫 Sarah Tucker College</h2>

    <p class="subtitle">
        Smart Campus Navigation
    </p>

    <label>From</label>

    <select id="start">
        <option value="Main Gate">Main Gate</option>
    </select>

    <label>To</label>

    <input
        id="destination"
        type="text"
        placeholder="Search Computer Science, Library..."
        autocomplete="off">

    <div id="results"></div>

    <button id="navigateBtn">
        🚶 Start Navigation
    </button>

    <div id="routeInfo"></div>

</div>

<div class="location-button"
     onclick="goToCollege()">
    📍
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="{{ url_for('static', filename='js/campus_map.js') }}"></script>

</body>
</html>
