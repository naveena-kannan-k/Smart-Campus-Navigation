<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Campus Location</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #333;
        }

        .container {
            width: 95%;
            max-width: 1100px;
            margin: 25px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.10);
        }

        h2 {
            text-align: center;
            color: #800040;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 12px 0 6px;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        #updateMap {
            width: 100%;
            height: 500px;
            margin-top: 18px;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #ddd;
        }

        .info {
            margin-top: 12px;
            padding: 12px;
            background: #f8eaf1;
            border-radius: 10px;
            font-size: 14px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            border: none;
            padding: 12px 18px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        #drawRouteBtn {
            background: #1565c0;
            color: white;
        }

        #finishRouteBtn {
            background: #2e7d32;
            color: white;
        }

        #clearRouteBtn {
            background: #d32f2f;
            color: white;
        }

        .update-btn {
            width: 100%;
            margin-top: 18px;
            background: #800040;
            color: white;
            font-size: 16px;
        }

        .status {
            margin-top: 12px;
            font-weight: bold;
            color: #555;
        }

        @media (max-width: 600px) {

            .container {
                width: 94%;
                margin: 15px auto;
            }

            .card {
                padding: 16px;
            }

            #updateMap {
                height: 400px;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h2>📍 Update Campus Location & Route</h2>

        <form method="POST"
              action="/admin/update"
              id="updateForm">

            <label>Select Building</label>

            <select name="building_id"
                    id="building"
                    required>

                <option value="">-- Select Building --</option>

                {% for building in buildings %}

                <option value="{{ building.id }}"
                        data-lat="{{ building.latitude or '' }}"
                        data-lng="{{ building.longitude or '' }}">

                    {{ building.name }}

                </option>

                {% endfor %}

            </select>


            <div id="updateMap"></div>


            <div class="info">

                <div>
                    <b>Latitude:</b>
                    <span id="latText">Not selected</span>
                </div>

                <div>
                    <b>Longitude:</b>
                    <span id="lngText">Not selected</span>
                </div>

            </div>


            <input type="hidden"
                   name="latitude"
                   id="latitude">

            <input type="hidden"
                   name="longitude"
                   id="longitude">

            <input type="hidden"
                   name="route_points"
                   id="route_points">


            <div class="buttons">

                <button type="button"
                        id="drawRouteBtn">

                    🛣️ Draw Route

                </button>

                <button type="button"
                        id="finishRouteBtn">

                    ✅ Finish Route

                </button>

                <button type="button"
                        id="clearRouteBtn">

                    🗑️ Clear Route

                </button>

            </div>


            <div class="status"
                 id="routeStatus">

                Select a building and click its exact location on the map.

            </div>


            <button type="submit"
                    class="update-btn">

                📍 Update Location & Route

            </button>

        </form>

    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const COLLEGE_CENTER = [8.6988565, 77.739888];

const map = L.map("updateMap")
    .setView(COLLEGE_CENTER, 18);


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 22,
        attribution: "&copy; OpenStreetMap"
    }
).addTo(map);


let marker = null;

let routeLine = null;

let routePoints = [];

let drawingRoute = false;


// --------------------------------------------------
// BUILDING SELECTION
// --------------------------------------------------

document
    .getElementById("building")
    .addEventListener("change", function () {

        const option =
            this.options[this.selectedIndex];

        const lat =
            option.dataset.lat;

        const lng =
            option.dataset.lng;


        // Remove old marker
        if (marker) {

            map.removeLayer(marker);

            marker = null;
        }


        // Remove old route
        clearRoute();


        if (lat && lng) {

            const position = [
                parseFloat(lat),
                parseFloat(lng)
            ];

            marker = L.marker(position)
                .addTo(map);

            marker.bindPopup(
                "<b>" +
                option.text.trim() +
                "</b>"
            ).openPopup();


            map.setView(position, 19);


            document.getElementById("latitude").value =
                lat;

            document.getElementById("longitude").value =
                lng;

            document.getElementById("latText").textContent =
                lat;

            document.getElementById("lngText").textContent =
                lng;

            document.getElementById("routeStatus").textContent =
                "Existing location loaded. You can draw or update the route.";

        } else {

            document.getElementById("latitude").value = "";

            document.getElementById("longitude").value = "";

            document.getElementById("latText").textContent =
                "Not selected";

            document.getElementById("lngText").textContent =
                "Not selected";

            map.setView(
                COLLEGE_CENTER,
                18
            );

            document.getElementById("routeStatus").textContent =
                "Click the exact building location on the map.";

        }

    });


// --------------------------------------------------
// MAP CLICK = BUILDING LOCATION
// --------------------------------------------------

map.on("click", function (e) {

    // If drawing route, add route point
    if (drawingRoute) {

        routePoints.push([
            Number(e.latlng.lat.toFixed(7)),
            Number(e.latlng.lng.toFixed(7))
        ]);

        redrawRoute();

        return;
    }


    const building =
        document.getElementById("building").value;


    if (!building) {

        alert("Please select a building first.");

        return;
    }


    const lat =
        e.latlng.lat.toFixed(7);

    const lng =
        e.latlng.lng.toFixed(7);


    document.getElementById("latitude").value =
        lat;

    document.getElementById("longitude").value =
        lng;


    document.getElementById("latText").textContent =
        lat;

    document.getElementById("lngText").textContent =
        lng;


    if (marker) {

        map.removeLayer(marker);
    }


    marker = L.marker([
        parseFloat(lat),
        parseFloat(lng)
    ])
    .addTo(map);


    marker.bindPopup(
        "📍 Building Location"
    ).openPopup();


    document.getElementById("routeStatus").textContent =
        "Location selected. Now click Draw Route.";

});


// --------------------------------------------------
// DRAW ROUTE
// --------------------------------------------------

document
    .getElementById("drawRouteBtn")
    .addEventListener("click", function () {

        const building =
            document.getElementById("building").value;


        const lat =
            document.getElementById("latitude").value;

        const lng =
            document.getElementById("longitude").value;


        if (!building) {

            alert("Please select a building.");

            return;
        }


        if (!lat || !lng) {

            alert("Please click the building location on the map first.");

            return;
        }


        drawingRoute = true;

        routePoints = [

            [
                COLLEGE_CENTER[0],
                COLLEGE_CENTER[1]
            ]

        ];


        redrawRoute();


        document.getElementById("routeStatus").textContent =
            "Route drawing ON: click the road points from Main Gate to the building.";

    });


// --------------------------------------------------
// REDRAW ROUTE
// --------------------------------------------------

function redrawRoute() {

    if (routeLine) {

        map.removeLayer(routeLine);
    }


    if (routePoints.length < 2) {

        return;
    }


    routeLine = L.polyline(
        routePoints,
        {
            color: "#1565c0",
            weight: 6,
            opacity: 0.9
        }
    ).addTo(map);

}


// --------------------------------------------------
// FINISH ROUTE
// --------------------------------------------------

document
    .getElementById("finishRouteBtn")
    .addEventListener("click", function () {

        if (!drawingRoute) {

            alert("Click Draw Route first.");

            return;
        }


        const lat =
            document.getElementById("latitude").value;

        const lng =
            document.getElementById("longitude").value;


        if (!lat || !lng) {

            alert("Building location is missing.");

            return;
        }


        // Add exact building location as final point
        routePoints.push([

            Number(parseFloat(lat).toFixed(7)),
            Number(parseFloat(lng).toFixed(7))

        ]);


        redrawRoute();


        document.getElementById("route_points").value =
            JSON.stringify(routePoints);


        drawingRoute = false;


        document.getElementById("routeStatus").textContent =
            "✅ Route completed. Now click Update Location & Route.";

    });


// --------------------------------------------------
// CLEAR ROUTE
// --------------------------------------------------

function clearRoute() {

    drawingRoute = false;

    routePoints = [];


    if (routeLine) {

        map.removeLayer(routeLine);

        routeLine = null;
    }


    document.getElementById("route_points").value = "";

}


// --------------------------------------------------
// CLEAR BUTTON
// --------------------------------------------------

document
    .getElementById("clearRouteBtn")
    .addEventListener("click", function () {

        clearRoute();

        document.getElementById("routeStatus").textContent =
            "Route cleared. Click Draw Route to create a new route.";

    });


// --------------------------------------------------
// FORM VALIDATION
// --------------------------------------------------

document
    .getElementById("updateForm")
    .addEventListener("submit", function (e) {

        const lat =
            document.getElementById("latitude").value;

        const lng =
            document.getElementById("longitude").value;

        const route =
            document.getElementById("route_points").value;


        if (!lat || !lng) {

            e.preventDefault();

            alert("Please select the building location on the map.");

            return;
        }


        if (!route) {

            e.preventDefault();

            alert("Please draw and finish the route.");

            return;
        }

    });

</script>

</body>
</html>
