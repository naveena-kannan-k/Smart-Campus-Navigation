<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add New Building | Smart Campus Navigation</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fff5f9, #f8edf3);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .admin-card {
            width: 100%;
            max-width: 750px;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .page-title {
            text-align: center;
            color: #800040;
            margin-bottom: 8px;
        }

        .page-title i {
            margin-right: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #800040;
            box-shadow: 0 0 0 3px rgba(128, 0, 64, 0.08);
        }

        .form-group textarea {
            height: 90px;
            resize: none;
        }

        /* MAP */

        .map-label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .map-instruction {
            font-size: 13px;
            color: #777;
            margin-bottom: 10px;
        }

        #adminMap {
            width: 100%;
            height: 350px;
            border-radius: 15px;
            border: 2px solid #eee;
            overflow: hidden;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
        }

        .location-info {
            margin-top: 12px;
            padding: 12px 15px;
            background: #fff5f9;
            border-radius: 10px;
            border-left: 4px solid #800040;
            font-size: 13px;
            color: #555;
        }

        .location-info strong {
            color: #800040;
        }

        .button-area {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }

        .save-btn {
            background: #800040;
            color: white;
        }

        .save-btn:hover {
            background: #650032;
        }

        .back-btn {
            background: #f1f1f1;
            color: #555;
        }

        .back-btn:hover {
            background: #e5e5e5;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .admin-card {
                padding: 25px 20px;
            }

            #adminMap {
                height: 300px;
            }

            .button-area {
                flex-direction: column;
            }
        }

    </style>

</head>

<body>

    <div class="admin-card">

        <h2 class="page-title">
            <i class="fa-solid fa-building-circle-plus"></i>
            Add New Building
        </h2>

        <p class="subtitle">
            Add a new building or campus location
        </p>


        <form method="POST"
              action="/admin/add"
              onsubmit="return validateLocation()">


            <!-- BUILDING NAME -->

            <div class="form-group">

                <label for="name">
                    Building Name
                </label>

                <input type="text"
                       id="name"
                       name="name"
                       placeholder="Enter building name"
                       required>

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea id="description"
                          name="description"
                          placeholder="Enter building description"></textarea>

            </div>


            <!-- CAMPUS MAP -->

            <div class="form-group">

                <label class="map-label">
                    <i class="fa-solid fa-location-dot"></i>
                    Select Building Location
                </label>

                <p class="map-instruction">
                    Click on the campus map to select the exact building location.
                </p>

                <div id="adminMap"></div>


                <div class="location-info">

                    <div>
                        <strong>Latitude:</strong>
                        <span id="latitudeText">
                            Not selected
                        </span>
                    </div>

                    <div>
                        <strong>Longitude:</strong>
                        <span id="longitudeText">
                            Not selected
                        </span>
                    </div>

                </div>

            </div>


            <!-- HIDDEN LOCATION VALUES -->

            <input type="hidden"
                   id="latitude"
                   name="latitude">

            <input type="hidden"
                   id="longitude"
                   name="longitude">


            <!-- BUTTONS -->

            <div class="button-area">

                <a href="/dashboard"
                   class="btn back-btn">

                    <i class="fa-solid fa-arrow-left"></i>
                    Back

                </a>


                <button type="submit"
                        class="btn save-btn">

                    <i class="fa-solid fa-floppy-disk"></i>
                    Save Building

                </button>

            </div>

        </form>

    </div>


    <!-- Leaflet JS -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


    <script>

        /*
         * Sarah Tucker College Main Gate
         * Existing campus center
         */

        const COLLEGE_CENTER = [
            8.6988565,
            77.739888
        ];


        /*
         * Create Admin Map
         */

        const adminMap = L.map("adminMap").setView(
            COLLEGE_CENTER,
            18
        );


        /*
         * OpenStreetMap
         */

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 22,
                attribution: "&copy; OpenStreetMap contributors"
            }
        ).addTo(adminMap);


        /*
         * Selected marker
         */

        let selectedMarker = null;


        /*
         * Click on map
         */

        adminMap.on("click", function(event) {

            const latitude = event.latlng.lat;
            const longitude = event.latlng.lng;


            /*
             * Remove previous marker
             */

            if (selectedMarker) {
                adminMap.removeLayer(selectedMarker);
            }


            /*
             * Create new marker
             */

            selectedMarker = L.marker(
                [latitude, longitude]
            ).addTo(adminMap);


            selectedMarker.bindPopup(
                "<b>New Building Location</b><br>" +
                "Selected location"
            ).openPopup();


            /*
             * Store coordinates
             */

            document.getElementById("latitude").value =
                latitude.toFixed(7);

            document.getElementById("longitude").value =
                longitude.toFixed(7);


            /*
             * Display coordinates
             */

            document.getElementById("latitudeText").textContent =
                latitude.toFixed(7);

            document.getElementById("longitudeText").textContent =
                longitude.toFixed(7);

        });


        /*
         * Check location before saving
         */

        function validateLocation() {

            const latitude =
                document.getElementById("latitude").value;

            const longitude =
                document.getElementById("longitude").value;


            if (!latitude || !longitude) {

                alert(
                    "Please click on the campus map to select the building location."
                );

                return false;
            }


            return true;
        }

    </script>

</body>

</html>
