
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add New Building | Smart Campus Navigation</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fff5f9, #f8edf3);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .admin-card {
            width: 100%;
            max-width: 650px;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .page-title {
            text-align: center;
            color: #800040;
            margin-bottom: 8px;
        }

        .page-title i {
            margin-right: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #800040;
            box-shadow: 0 0 0 3px rgba(128, 0, 64, 0.08);
        }

        .form-group textarea {
            height: 100px;
            resize: none;
        }

        .button-area {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }

        .save-btn {
            background: #800040;
            color: white;
        }

        .save-btn:hover {
            background: #650032;
        }

        .back-btn {
            background: #f1f1f1;
            color: #555;
        }

        .back-btn:hover {
            background: #e5e5e5;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .admin-card {
                padding: 25px 20px;
            }

            .button-area {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="admin-card">

        <h2 class="page-title">
            <i class="fa-solid fa-building-circle-plus"></i>
            Add New Building
        </h2>

        <p class="subtitle">
            Add a new building or campus location
        </p>

        <form>

            <div class="form-group">
                <label for="name">Building Name</label>
                <input type="text"
                       id="name"
                       name="name"
                       placeholder="Enter building name"
                       required>
            </div>

            <div class="form-group">
                <label for="x">X Coordinate</label>
                <input type="number"
                       id="x"
                       name="x"
                       placeholder="Enter X coordinate"
                       required>
            </div>

            <div class="form-group">
                <label for="y">Y Coordinate</label>
                <input type="number"
                       id="y"
                       name="y"
                       placeholder="Enter Y coordinate"
                       required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description"
                          name="description"
                          placeholder="Enter building description"></textarea>
            </div>

            <div class="button-area">

                <a href="/dashboard" class="btn back-btn">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back
                </a>

                <button type="submit" class="btn save-btn">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Save Building
                </button>

            </div>

        </form>

    </div>

</body>
</html>
